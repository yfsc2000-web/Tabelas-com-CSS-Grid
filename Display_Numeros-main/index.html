<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilos/style.css">
    <title>Displays de números</title>
</head>

<body>
    <main class="container">
        <!-- Display 1 (tabela) -->
        <h1>Display 1 (tabela):</h1>

        <table id="tabela">
            <tr>
                <td class="celula-tabela"><img src="./imgs/1.jpg" alt="Número 1" class="imagem-tabela"></td>
                <td class="celula-tabela"><img src="./imgs/2.jpg" alt="Número 2" class="imagem-tabela"></td>
                <td class="celula-tabela"><img src="./imgs/3.jpg" alt="Número 3" class="imagem-tabela"></td>
            </tr>

            <tr>
                <td class="celula-tabela"><img src="./imgs/4.jpg" alt="Número 4" class="imagem-tabela"></td>
                <td class="celula-tabela"><img src="./imgs/5.jpg" alt="Número 5" class="imagem-tabela"></td>
                <td class="celula-tabela"><img src="./imgs/6.jpg" alt="Número 6" class="imagem-tabela"></td>
            </tr>

            <tr class="linha-tabela">
                <td class="celula-tabela"><img src="./imgs/7.jpg" alt="Número 7" class="imagem-tabela"></td>
                <td class="celula-tabela"><img src="./imgs/8.jpg" alt="Número 8" class="imagem-tabela"></td>
                <td class="celula-tabela"><img src="./imgs/9.jpg" alt="Número 9" class="imagem-tabela"></td>
            </tr>
        </table>

        <!-- Displays 2 a 6 (grid)-->
        <h1>Display 2 (grid):</h1>

        <div class="grid">
            <div id="div-1-grid-2"><img src="./imgs/1.jpg" alt="Número 1" class="imagem-grid"></div>
            <div><img src="./imgs/2.jpg" alt="Número 2" class="imagem-grid"></div>
            <div><img src="./imgs/3.jpg" alt="Número 3" class="imagem-grid"></div>
            <div><img src="./imgs/4.jpg" alt="Número 4" class="imagem-grid"></div>
            <div><img src="./imgs/5.jpg" alt="Número 5" class="imagem-grid"></div>
            <div><img src="./imgs/6.jpg" alt="Número 6" class="imagem-grid"></div>
            <div id="div-7-grid-2"><img src="./imgs/7.jpg" alt="Número 7" class="imagem-grid"></div>
        </div>

        <h1>Display 3 (grid):</h1>

        <div class="grid">
            <div id="div-cima-grid-3"><img src="./imgs/1.jpg" alt="Número 1" class="imagem-grid"></div>
            <div id="div-baixo-grid-3"><img src="./imgs/2.jpg" alt="Número 2" class="imagem-grid"></div>
            <div id="div-baixo-grid-3"><img src="./imgs/3.jpg" alt="Número 3" class="imagem-grid"></div>
            <div id="div-baixo-grid-3"><img src="./imgs/4.jpg" alt="Número 4" class="imagem-grid"></div>
        </div>

        <h1>Display 4 (grid):</h1>

        <div class="grid">
            <div><img src="./imgs/1.jpg" alt="Número 1" class="imagem-grid"></div>
            <div id="div-2-grid-4"><img src="./imgs/2.jpg" alt="Número 2" class="imagem-grid"></div>
            <div><img src="./imgs/3.jpg" alt="Número 3" class="imagem-grid"></div>
            <div id="div-4-grid-4"><img src="./imgs/4.jpg" alt="Número 4" class="imagem-grid"></div>
            <div><img src="./imgs/5.jpg" alt="Número 5" class="imagem-grid"></div>
            <div><img src="./imgs/6.jpg" alt="Número 6" class="imagem-grid"></div>
            <div><img src="./imgs/7.jpg" alt="Número 7" class="imagem-grid"></div>
        </div>

        <h1>Display 5 (grid):</h1>

        <div class="grid">
            <div><img src="./imgs/1.jpg" alt="Número 1" class="imagem-grid"></div>
            <div id="div-2-grid-5"><img src="./imgs/2.jpg" alt="Número 2" class="imagem-grid"></div>
            <div><img src="./imgs/3.jpg" alt="Número 3" class="imagem-grid"></div>
            <div><img src="./imgs/4.jpg" alt="Número 4" class="imagem-grid"></div>
            <div><img src="./imgs/5.jpg" alt="Número 5" class="imagem-grid"></div>
            <div><img src="./imgs/6.jpg" alt="Número 6" class="imagem-grid"></div>
            <div><img src="./imgs/7.jpg" alt="Número 7" class="imagem-grid"></div>
        </div>

        <h1>Display 6 (grid):</h1>

        <div class="grid">
            <div><img src="./imgs/1.jpg" alt="Número 1" class="imagem-grid"></div>
            <div id="div-2-grid-6"><img src="./imgs/2.jpg" alt="Número 2" class="imagem-grid"></div>
            <div id="div-3-grid-6"><img src="./imgs/3.jpg" alt="Número 3" class="imagem-grid"></div>
            <div id="div-4-grid-6"><img src="./imgs/4.jpg" alt="Número 4" class="imagem-grid"></div>
        </div>

    </main>
</body>

</html>
